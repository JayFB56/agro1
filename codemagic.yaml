workflows:
  capacitor-android-build:
    name: Capacitor Android Build
    max_build_duration: 30
    environment:
      node: 22
    scripts:
      - npm install
      - npm run build
      - npx cap sync android
      - |
          cd android
          if [ ! -f gradlew ]; then
            echo "gradlew no encontrado, listando archivos en android:"
            ls -l
            echo "Intentando dar permisos a gradlew..."
            chmod +x gradlew || true
          fi
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk